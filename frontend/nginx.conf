server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ============================================================
  # HTTPS obrigatorio
  # ============================================================
  # O container escuta em HTTP porque quem termina o TLS e a camada da frente
  # (load balancer, ingress ou proxy reverso). Essa camada informa o protocolo
  # original em X-Forwarded-Proto; quando ele chega como "http", a requisicao
  # veio em texto claro e e redirecionada.
  #
  # Sem proxy na frente (ex.: `docker run -p 8080:80` local) o header nao
  # existe e nada e redirecionado - o ambiente de desenvolvimento continua
  # funcionando.
  #
  # Isto importa aqui mais do que numa aplicacao comum: o token de embed dos
  # paineis viaja na QUERY STRING, e em HTTP ele fica legivel para qualquer um
  # no caminho da rede.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  # HSTS: o navegador passa a recusar HTTP neste dominio, o que fecha a janela
  # do primeiro acesso em texto claro. Em HTTP puro o header e ignorado pelo
  # navegador, entao mante-lo aqui e inofensivo em desenvolvimento.
  #
  # ATENCAO: so habilite includeSubDomains se TODOS os subdominios tiverem
  # HTTPS. O efeito dura max-age (1 ano) e nao ha como voltar atras no
  # navegador de quem ja recebeu o header.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # SPA: qualquer rota do react-router cai no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy para a API. Ajuste o host conforme o seu deploy
  # (ex.: nome do servico no docker network, ou a URL publica da API).
  location /api/ {
    proxy_pass http://powerbi_backend:3333/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # add_header em bloco filho descarta os herdados do server, por isso o
    # HSTS e repetido aqui.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  # Cache dos assets com hash no nome.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
